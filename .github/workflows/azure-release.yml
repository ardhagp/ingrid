# Sending Discord notification for successful build and publish
- task: ado-discord-webhook@2
  displayName: 'Step-26: Sending Discord Notification for Success'
  condition: succeeded()
  inputs:
    webhookId: '$(var_g_Discord_WebhookID)'
    webhookKey: '$(var_g_Discord_WebhookKey)'
    name: 'Azure Devops'
    embeds: |
      [
        {
          "type": "rich",
          "title": "[$(System.TeamProject):$(Build.SourceBranchName)] • Compile and Publish Success!",
          "description": "Ingrid ver. $(var_g_Ingridversion_major).$(var_g_Ingridversion_minor) for $(var_Platform) platform.",
          "color": 0x00ff00,
          "fields": [
            {
              "name": "Build.Pipeline",
              "value": "$(Build.Repository.Name)",
              "inline": true
            },
            {
              "name": "Build.Number",
              "value": "$(Build.BuildNumber)",
              "inline": true
            }
          ],
          "url": "$(System.CollectionUri)/$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)&view=logs"
        }
      ]

# Sending Discord notification for failed build and publish
- task: ado-discord-webhook@2
  displayName: 'Step-27: Sending Discord Notification for Failure'
  condition: failed()
  inputs:
    webhookId: '$(var_g_Discord_WebhookID)'
    webhookKey: '$(var_g_Discord_WebhookKey)'
    name: 'Azure Devops'
    embeds: |
      [
        {
          "type": "rich",
          "title": "[$(System.TeamProject):$(Build.SourceBranchName)] • Compile and Publish failed",
          "description": "Ingrid v$(var_g_Ingridversion_major).$(var_g_Ingridversion_minor) for $(var_Platform) platform.",
          "color": 0xff0000,
          "fields": [
            {
              "name": "Build.Pipeline",
              "value": "$(Build.Repository.Name)",
              "inline": true
            },
            {
              "name": "Revision.Number",
              "value": "$(var_g_Ingridversion_revision)",
              "inline": true
            }
          ],
          "url": "$(System.CollectionUri)/$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)&view=logs"
        }
      ]

# Updating {Version.Minor} for next build
- task: update-variablegroup-variable@0
  condition: succeeded()
  displayName: 'Step-28: Bump {Version.Minor} For Next Build'
  inputs:
    variableGroupName: 'global_variables'
    variableName: 'var_g_Ingridversion_minor'
    variableDataType: 'int'
    newVariableValueInInt: 1
    usePAT: true
    patValue: '$(var_g_TOKEN_AZURE)'

# Updating {Version.Revision} for next build
- task: update-variablegroup-variable@0
  condition: failed()
  displayName: 'Step-29: Bump {Version.Revision} For Next Build'
  inputs:
    variableGroupName: 'global_variables'
    variableName: 'var_g_Ingridversion_revision'
    variableDataType: 'int'
    newVariableValueInInt: 1
    usePAT: true
    patValue: '$(var_g_TOKEN_AZURE)'
