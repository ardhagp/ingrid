# Send Discord notification for transferring application to Github Pages
- task: ado-discord-webhook@2
  displayName: 'Step-23: Sending Discord Notification'
  condition: succeeded()
  inputs:
    webhookId: '$(var_g_Discord_WebhookID)'
    webhookKey: '$(var_g_Discord_WebhookKey)'
    name: 'Azure Devops'
    embeds: |
      [
        {
          "type": "rich",
          "title": "Transfering application",
          "description": "Transfering Ingrid v$(var_g_Ingridversion_major).$(var_g_Ingridversion_minor) to Github.io page.",
          "color": 0xee27f5,
          "url": "$(System.CollectionUri)/$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)&view=logs"
        }
      ]

